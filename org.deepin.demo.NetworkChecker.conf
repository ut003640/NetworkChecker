<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/software/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.deepin.demo.NetworkChecker"/>
    <allow send_destination="org.deepin.demo.NetworkChecker"/>
    <allow receive_sender="org.deepin.demo.NetworkChecker"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.deepin.demo.NetworkChecker"/>
    <allow receive_sender="org.deepin.demo.NetworkChecker"/>
  </policy>
</busconfig>
